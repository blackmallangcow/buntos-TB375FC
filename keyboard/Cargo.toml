[package]
name = "bunt-keyboard"
description = "buntOS on-screen keyboard shared by the shell, the login window and the lock screen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# 키의 접근성 이름 (i18n/<언어>/bunt-keyboard.ftl)
bunt-i18n = { path = "../i18n" }
# 컴포지터의 셸 전용 화면 키보드 프로토콜(bunt_osk_v1)을 GTK의 Wayland 연결에서 쓴다 (compositor.rs)
gdk4-wayland = { version = "0.11", features = ["wayland_crate"] }
# 셸(bunt-shell)과 로그인·잠금 화면(bunt-greeter)과 같은 판
gtk4 = { version = "0.11", features = ["v4_12"] }
# gtk4-layer-shell(셸, 잠금 화면)은 libwayland-client보다 먼저 링크돼야 동작한다. 직접 링크하지 않고 실행 중에
# 연다(dlopen, shell/Cargo.toml과 같다)
wayland-client = { version = "0.31", features = ["dlopen"] }
# comp/protocols/bunt-osk-v1.xml에서 클라이언트 코드를 만든다
wayland-scanner = "0.31"

[dev-dependencies]
# 시험용 컴포지터 (compositor.rs의 프로토콜 시험)
wayland-server = "0.31"
