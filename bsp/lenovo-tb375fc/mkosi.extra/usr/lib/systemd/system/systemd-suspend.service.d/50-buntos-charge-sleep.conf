#
# TB375FC: with a charger in, suspend wakes every 10 seconds without the screen so the
# charger can follow the battery, as stock does (charge-sleep). Without one it is the
# same single systemd-sleep as before.
[Service]
ExecStart=
ExecStart=/usr/libexec/buntos/charge-sleep
