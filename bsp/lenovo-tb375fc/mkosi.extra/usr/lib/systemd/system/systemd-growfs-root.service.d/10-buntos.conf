#
# 이 보드에서는 파티션을 늘리지 않으므로(mkosi.postinst.chroot) 파일 시스템만 파티션 끝까지 늘린다. systemd-growfs는
# BTRFS_IOC_RESIZE로 파일 시스템만 고치고 파티션 표는 건드리지 않는다. 공통 레시피는 GPT 속성 59와 gpt-auto 생성기로 이
# 서비스를 켜는데, 이 보드는 그 생성기를 가리므로 mkosi.postinst.chroot가 local-fs.target에 직접 건다.
# 다 늘어난 뒤에는 할 일이 없다. 읽기 전용 루트(ro)에서는 돌지 않는다

[Unit]
ConditionPathIsReadWrite=/
Before=local-fs.target
