# TB375FC: GPU 전원부가 약 550 MHz 위에서 귀에 들린다. 스크롤과 창 움직임은 542 MHz까지만 쓰고,
# GPU가 그 클럭에서 계속 꽉 차는 일(게임 등)만 1400 MHz까지 올린다(패치 0203, 드라이버 기본값은 꺼짐).
# 귀 시험과 측정은 docs/tb375fc/bringup-checklist.md에 있다.
options panthor soft_max_mhz=542
