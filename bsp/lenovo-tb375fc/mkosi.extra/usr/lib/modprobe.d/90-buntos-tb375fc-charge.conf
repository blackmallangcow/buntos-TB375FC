# TB375FC: PPS 충전기에서 차지 펌프(UPM6720)로 직충전한다. 드라이버(패치 0177)의 기본값은
# 꺼짐이다. 조건(게이지 3.5~4.15 V, 배터리 16~36도 등) 밖이면 MT6375가 그대로 충전한다.
# 시험 결과는 docs/tb375fc/bringup-checklist.md에 있다.
options mt6375_charger direct_charge=1
