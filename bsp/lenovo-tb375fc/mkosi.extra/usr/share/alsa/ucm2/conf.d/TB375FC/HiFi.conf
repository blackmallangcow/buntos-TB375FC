#
# 경로는 동사에서 켠다. DPCM은 믹서가 켜져 있어야 PCM을 열 수 있고, ACP가 장치를 고르기 전에 PCM을 열어 본다.
#
# 스피커: 들고 있는 방향으로 슬롯 0(0x35) 왼쪽 아래, 슬롯 2(0x34) 왼쪽 위, 슬롯 1(0x37) 오른쪽 아래, 슬롯 3(0x36) 오른쪽 위
# 앰프의 음량 컨트롤은 감쇠다. 값이 클수록 작아지고 0이 가장 크다. 그래서 PlaybackMixerElem으로 주지 않고, 음량은
# PipeWire의 소프트웨어 음량이 맡는다. 값은 1/8 dB 단위고, 144(-18 dB)는 사용자가 슬라이더 100%를 들어 보고 고른 값이다.
# 마이크: AIN0을 두 채널에 같이 싣는다. 사용자가 들어 보고 고른 입력이다
SectionVerb {
	Value {
		TQ "HiFi"
	}

	EnableSequence [
		cset "name='Amp0 PCM Playback Volume' 144"
		cset "name='Amp1 PCM Playback Volume' 144"
		cset "name='Amp2 PCM Playback Volume' 144"
		cset "name='Amp3 PCM Playback Volume' 144"
		cset "name='Amp0 Profile Set' Music"
		cset "name='Amp1 Profile Set' Music"
		cset "name='Amp2 Profile Set' Music"
		cset "name='Amp3 Profile Set' Music"
		cset "name='I2SOUT4_CH1 DL0_CH1' on"
		cset "name='I2SOUT4_CH2 DL0_CH2' on"
		cset "name='I2SOUT4_CH3 DL0_CH1' on"
		cset "name='I2SOUT4_CH4 DL0_CH2' on"
		cset "name='Speakers Switch' on"

		cset "name='PGA_L_Mux' AIN0"
		cset "name='ADC_L_Mux' Left Preamplifier"
		cset "name='MISO0_MUX' UL1_CH1"
		cset "name='MISO1_MUX' UL1_CH1"
		cset "name='PGA1 Volume' 4"
		cset "name='UL0_CH1 ADDA_UL_CH1' on"
		cset "name='UL0_CH2 ADDA_UL_CH2' on"
	]

	DisableSequence [
		cset "name='I2SOUT4_CH1 DL0_CH1' off"
		cset "name='I2SOUT4_CH2 DL0_CH2' off"
		cset "name='I2SOUT4_CH3 DL0_CH1' off"
		cset "name='I2SOUT4_CH4 DL0_CH2' off"
		cset "name='UL0_CH1 ADDA_UL_CH1' off"
		cset "name='UL0_CH2 ADDA_UL_CH2' off"
	]
}

SectionDevice."Speaker" {
	Comment "Speakers"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackRate 48000
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureRate 48000
		CaptureChannels 2
	}
}
