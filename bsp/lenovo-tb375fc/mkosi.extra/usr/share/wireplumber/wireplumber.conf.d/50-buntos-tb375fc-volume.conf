# 처음 보는 출력의 음량. 값은 선형이고 슬라이더 55%(0.55의 세제곱)다. 로그인 화면의 시동음이 이 음량으로 난다.
# 앰프 쪽 상한은 UCM의 감쇠(-18 dB)가 정한다. 이 값을 올려도 슬라이더 100%의 크기는 그대로다. 사용자가 시동음을
# 들어 보고 고른 값이다.
wireplumber.settings = {
  device.routes.default-sink-volume = 0.166375
}
