# /usr/libexec/buntos/apt-guard가 읽는다. bash 문법이다.

# 지켜 볼 경로. apt 앞뒤로 해시를 재서 달라지면 알린다. 막는 것은 아래 설정이고 이것은 마지막 확인이다
GUARD_PATHS=(
	/usr/bin/bunt /usr/bin/bunt-* /usr/bin/buntd-agent
	/usr/libexec/buntos /usr/share/buntos /etc/buntos
	/usr/lib/systemd/system/buntos-* /usr/lib/systemd/system/buntd-* /usr/lib/systemd/user/buntd-*
	/usr/lib/systemd/system/greetd.service.d
	/usr/lib/systemd/system-preset/10-buntos-tb375fc.preset
	/usr/lib/udev/rules.d/90-buntos-tb375fc-hide-ufs.rules
	/usr/lib/modules
	/usr/lib/firmware/lenovo
	/usr/lib/firmware/arm/mali/arch11.8
	/opt/mesa /etc/ld.so.conf.d/00-opt-mesa.conf
	/etc/greetd/config.toml
	/usr/lib/os-release
)

# buntos-runtime이 라이브러리를 잡아 줄 바이너리. 스크립트는 건너뛴다
GUARD_ELF=(/usr/bin/bunt /usr/bin/bunt-* /usr/bin/buntd-agent /usr/libexec/buntos/*)

# 바이너리가 링크하지는 않지만 스크립트와 서비스가 부르거나, 컴포지터가 실행 중에 여는(libEGL, libGLESv2) 꾸러미.
# 설치되어 있는 것만 넣는다
GUARD_DEPENDS=(
	libegl1 libgles2
	greetd network-manager wpasupplicant upower btrfs-progs kmod udev dbus polkitd
	pipewire wireplumber fcitx5 xdg-desktop-portal xdg-desktop-portal-gtk gnome-keyring
	i2c-tools gpiod iw rfkill busybox-static openssh-server
)

# apt가 올리거나 지우지 못하게 고정한다
# - 커널: 부팅 커널은 boot 파티션에 따로 굽고, 모듈은 꾸러미가 아는 파일과 다르다(압축을 풀었다)
# - Mesa: Debian 판은 이 기기의 GPU(G615)를 모른다
# - firmware-misc-nonfree: GPU 펌웨어(arm/mali/arch11.8/mali_csffw.bin)가 여기서 온다
GUARD_HOLD=(buntos-runtime buntos-mesa 'linux-image-*-tb375fc' firmware-misc-nonfree)

# 꾸러미가 같은 경로를 들고 와도 우리 파일을 그대로 두고, 꾸러미의 것은 <경로>.dpkg-dist로 받는다
# - os-release: mkosi가 IMAGE_ID를 더했고 base-files가 덮어쓴다
# - mimeapps.list: forky에서 경로가 겹치는 꾸러미가 하나 있다(sxmo-utils)
GUARD_DIVERT=(/usr/lib/os-release /usr/share/applications/mimeapps.list)

# 이 라이브러리는 이 자리에서 읽혀야 한다. 라이브러리=경로 앞부분
GUARD_LIBS=(libgbm.so.1=/opt/mesa/ libEGL_mesa.so.0=/opt/mesa/)

# 켜짐 상태를 비교할 서비스
GUARD_UNITS=('buntos-*' greetd.service NetworkManager.service)

# 남길 스냅숏 수와, 스냅숏을 만들 때 있어야 할 루트 여유
GUARD_KEEP=3
GUARD_MIN_FREE_GB=3
