# TB375FC가 공통 설정(/etc/buntos/apt-guard.conf)에 더하는 것. /usr/libexec/buntos/apt-guard가 그 뒤에 읽는다. bash 문법이다.

# 커널 모듈, GPU와 패널 펌웨어, Mesa, 보드의 프리셋과 규칙
GUARD_PATHS+=(
	/usr/lib/systemd/system-preset/10-buntos-tb375fc.preset
	/usr/lib/udev/rules.d/90-buntos-tb375fc-hide-ufs.rules
	/usr/lib/modules
	/usr/lib/firmware/lenovo
	/usr/lib/firmware/arm/mali/arch11.8
	/opt/mesa /etc/ld.so.conf.d/00-opt-mesa.conf
	/usr/share/alsa/ucm2/conf.d/TB375FC
	/usr/share/wireplumber/wireplumber.conf.d/50-buntos-tb375fc-volume.conf
)

# 보드 스크립트가 부르는 도구
GUARD_DEPENDS+=(i2c-tools gpiod iw rfkill busybox-static openssh-server alsa-utils alsa-ucm-conf)

# - 커널: 부팅 커널은 boot 파티션에 따로 굽고, 모듈은 꾸러미가 아는 파일과 다르다(압축을 풀었다)
# - Mesa: Debian 판은 이 기기의 GPU(G615)를 모른다
# - firmware-misc-nonfree: GPU 펌웨어(arm/mali/arch11.8/mali_csffw.bin)가 여기서 온다
GUARD_HOLD+=(buntos-mesa 'linux-image-*-tb375fc' firmware-misc-nonfree)

# Mesa는 /opt/mesa에서 읽혀야 한다
GUARD_LIBS+=(libgbm.so.1=/opt/mesa/ libEGL_mesa.so.0=/opt/mesa/)
