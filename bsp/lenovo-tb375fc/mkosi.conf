# BSP: Lenovo TB375FC(와 같은 하드웨어인 TB373FU), MediaTek MT6897. 태블릿 라인의 첫 기기 (docs/tb375fc/DESIGN.md)
# - 커널: Debian linux-image-arm64 대신 kernel/tb375fc/build.sh image가 만든 커널 .deb를 넣는다(kernel.org 원본 + 패치
#   대기열, Debian forky 설정 + 보드 조각, 설계안 D1·4절). build.sh의 version이나 조각의 LOCALVERSION이 바뀌면 아래
#   꾸러미 이름도 고친다. 꾸러미는 커널을 /boot/vmlinuz-<판>에 두고, mkosi가 그것을 자기가 찾는 자리
#   /usr/lib/modules/<판>/vmlinuz로 복사해 UKI를 만든다(mkosi 27.1의 fixup_vmlinuz_location)
# - 부팅: 이 기기는 EFI가 아니라 LK가 boot·vendor_boot·init_boot를 읽는다(설계안 D3, 2.2절). 그래도 공통 레시피의
#   Bootable=yes, Bootloader=systemd-boot는 여기서 바꿀 수 없다. tools/image/build.sh가 이 디렉터리를 --include로 넣어
#   image/보다 먼저 읽히고, 값 하나를 받는 설정은 나중에 읽은 image/의 값이 이긴다(mkosi summary로 확인). 그래서 이미지에는
#   ESP, systemd-boot, UKI(mkosi 기본 initrd)가 그대로 생긴다. U-Boot로 EFI 부팅을 하게 되면 그대로 쓴다
# - LK로 띄울 때는 루트 파티션(buntos.root-arm64.raw)만 기기에 굽고, 부트 이미지는 boot/mkimages.sh가 같은 커널 꾸러미의
#   Image·장치 트리와 initramfs로 만든다. 루트 파티션을 둘 자리와 명령줄은 아직 정하지 않았다

[Distribution]
Architecture=arm64

[Output]
# 기본(uki)에 더해 UKI에서 꺼낸 커널(압축하지 않은 Image)과 initrd, 파티션별 파일을 따로 낸다. 기기에는 파티션 단위로 굽는다
SplitArtifacts=uki,kernel,initrd,partitions

[Content]
# build.sh image의 출력이다. mkosi가 이 디렉터리의 꾸러미로 지역 저장소를 만든다. 경로는 기본 빌드 디렉터리이고,
# tools/image/build.sh가 BUNTOS_BUILD_DIR를 내보내지 않아 그 값을 따르지 못한다
PackageDirectories=~/buntos-build/tb375fc/deb
Packages=linux-image-7.2.12-tb375fc
