#
# ../test.sh --root에 줄 작은 시험 이미지. 공통 레시피의 디스크 정의와 기본 꾸러미에 보드 프로필을 얹고, 데스크톱과 펌웨어를 뺐다.
# 전체 이미지보다 훨씬 작아(루트 파티션 파일 약 1.3GB) 맥 디스크가 빠듯해도 만들 수 있다. 빌드 VM에서 저장소 꼭대기에서:
#   mkosi -C bsp/lenovo-tb375fc/initramfs/test-image --include="$PWD/bsp/lenovo-tb375fc" --output-directory=<디렉터리> -f build
# 출력의 buntos.root-arm64.raw를 test.sh --root에 준다. 공통 레시피와 같은 Debian 시점을 쓴다.
# 공통 레시피에 없는 것: iproute2와 openssh-client는 시험의 호스트 쪽 도구이고, mount는 전체 이미지에서는 다른 꾸러미가 끌어 온다.
# 부트 로더와 UKI는 만들지 않는다. LK로 띄울 때는 쓰지 않는다

[Distribution]
Distribution=debian
Release=forky
Snapshot=20261027T083111Z

[Output]
Format=disk
ImageId=buntos
RepartDirectories=../../../../image/mkosi.repart

[Content]
Bootable=no
Bootloader=none
ExtraTrees=../../../../image/mkosi.extra
Packages=
        login
        passwd
        apt
        tzdata
        debian-archive-keyring
        ca-certificates
        systemd
        systemd-sysv
        udev
        dbus
        btrfs-progs
        sudo
        libnss-myhostname
        network-manager
        curl
        systemd-repart
        iproute2
        openssh-client
        kmod
        procps
        mount
Locale=C.UTF-8
Timezone=Asia/Seoul
Keymap=us
Hostname=buntos
Autologin=yes
