# BSP: x86-64 일반 PC (UEFI). QEMU에서도 같은 이미지를 쓴다 (ARCHITECTURE 4.1)

[Distribution]
Architecture=x86-64

[Content]
# CPU 마이크로코드(부팅 때 initrd가 올린다)와 Intel CPU 발열 관리
Packages=
        linux-image-amd64
        amd64-microcode
        intel-microcode
        thermald
