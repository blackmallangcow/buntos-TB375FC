# 한자 후보 창과 입력 소스 표시기의 모양. 글꼴은 UI 글꼴(Pretendard), 목록은 macOS처럼 세로로,
# 테마는 buntOS 테마(/usr/share/fcitx5/themes/buntos), 밝게·어둡게는 시스템 설정을 따른다.
# 강조색은 테마의 파랑을 쓴다 (GTK 포털은 강조색을 알려 주지 않는다)

Vertical Candidate List=True
Font="Pretendard 12"
MenuFont="Pretendard 12"
TrayFont="Pretendard Medium 11"
PreferTextIcon=True
Theme=buntos
DarkTheme=buntos-dark
UseDarkTheme=True
UseAccentColor=False
