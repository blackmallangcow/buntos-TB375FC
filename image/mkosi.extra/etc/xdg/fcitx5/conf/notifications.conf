# 띄우지 않을 fcitx5 알림 (알림의 "다시 표시 안함"이 쓰는 목록과 같다). fcitx5의 Wayland 진단은 다른
# 데스크톱을 위한 안내다: GNOME 셸 확장(kimpanel)을 깔라, KWin이 띄우게 하라, 입력 모듈 환경 변수를
# 지우라. buntOS는 컴포지터가 fcitx5를 input-method-v2로 띄우고 입력기 팝업과 입력 소스를 다루므로 맞지
# 않거나 사용자를 헷갈리게 한다. fcitx5가 다른 환경으로 떠도(터미널에서 띄우기 등) 감춘다

