#
# /usr/libexec/buntos/apt-guard가 읽는다. bash 문법이다.
#
# 이 파일은 모든 이미지에 공통이다. 보드가 더 지킬 것은 /etc/buntos/apt-guard.conf.d/*.conf에 GUARD_HOLD+=(...)처럼
# 더한다(이름 차례로 이 파일 뒤에 읽는다). 데스크톱 이미지는 Debian 커널과 Mesa, 펌웨어를 그대로 쓰므로 고정하지 않는다.
# apt가 그것을 올리는 것은 보안 업데이트이고, 막으면 오히려 망가진다.

# 지켜 볼 경로. apt 앞뒤로 해시를 재서 달라지면 알린다. 막는 것은 아래 설정이고 이것은 마지막 확인이다.
# 꾸러미가 함께 고치는 파일(gschemas.compiled, 아이콘 캐시)은 넣지 않는다
GUARD_PATHS=(
	/usr/bin/bunt /usr/bin/bunt-* /usr/bin/buntd-agent
	/usr/libexec/buntos /usr/share/buntos /etc/buntos
	/usr/lib/systemd/system/buntos-* /usr/lib/systemd/system/buntd-* /usr/lib/systemd/user/buntd-*
	/usr/lib/systemd/system/greetd.service.d /usr/lib/tmpfiles.d/bunt-greeter.conf
	/etc/greetd/config.toml /etc/pam.d/bunt-lock
	/etc/apt/apt.conf.d/70-buntos-guard /usr/sbin/policy-rc.d
	/usr/lib/repart.d/10-root.conf /usr/lib/environment.d/70-buntos-games.conf
	/usr/share/dbus-1/system-services/org.buntos.* /usr/share/dbus-1/system.d/org.buntos.*
	/usr/share/polkit-1/actions/org.buntos.* /usr/share/polkit-1/rules.d/49-buntos-*
	/usr/share/applications/org.buntos.* /usr/share/applications/mimeapps.list
	/usr/share/glib-2.0/schemas/org.buntos.* /usr/share/glib-2.0/schemas/90_buntos.gschema.override
	/usr/share/xdg-desktop-portal/buntos-portals.conf
	/usr/share/backgrounds/buntos /usr/share/sounds/buntos /usr/share/icons/hicolor/scalable/apps/org.buntos.*
	/usr/share/fcitx5/themes/buntos /usr/share/fcitx5/themes/buntos-dark /etc/xdg/fcitx5
	/usr/bin/foot /etc/xdg/foot/foot.ini
	/usr/lib/os-release
)

# buntos-runtime이 라이브러리를 잡아 줄 바이너리. 스크립트는 건너뛴다
GUARD_ELF=(/usr/bin/bunt /usr/bin/bunt-* /usr/bin/buntd-agent /usr/libexec/buntos/* /usr/bin/foot)

# 바이너리가 링크하지는 않지만 실행 중에 열거나, 부르거나, 세션이 기대는 꾸러미. 설치되어 있는 것만 넣는다.
# 앱(파일, 웹 브라우저)은 넣지 않는다. 세션이 그것 없이도 뜨고, 넣으면 그 꾸러미의 전환까지 막는다
GUARD_DEPENDS=(
	# 컴포지터가 실행 중에 여는 것(libEGL, libGLESv2)과 렌더러, GTK가 없으면 끝나는 스키마와 설정 저장소
	libegl1 libgles2 libegl-mesa0 libgl1-mesa-dri
	gsettings-desktop-schemas dconf-gsettings-backend xkb-data adwaita-icon-theme
	# 로그인과 세션
	greetd accountsservice polkitd pkexec dbus dbus-user-session gnome-keyring libpam-gnome-keyring
	xdg-desktop-portal xdg-desktop-portal-gtk at-spi2-core fcitx5 fcitx5-hangul foot
	# 네트워크, 소리, 전원, 저장 장치
	network-manager wpasupplicant pipewire pipewire-bin wireplumber upower btrfs-progs kmod udev
	# 바이너리와 스크립트가 부르는 명령: gio(libglib2.0-bin), script(bsdutils), useradd와 passwd(passwd), 화면 기록,
	# 앱 설치(packagekit, flatpak, unsquashfs), apt-guard refresh(python3)
	libglib2.0-bin bsdutils passwd gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good
	packagekit flatpak squashfs-tools python3
)

# apt가 올리거나 지우지 못하게 고정한다. 공통으로는 buntos-runtime뿐이다. 이것이 고정되어 있어 apt는 의존성을 지우지 않는다
GUARD_HOLD=(buntos-runtime)

# 꾸러미가 같은 경로를 들고 와도 우리 파일을 그대로 두고, 꾸러미의 것은 <경로>.dpkg-dist로 받는다
# - os-release: mkosi가 IMAGE_ID를 더했고 base-files가 덮어쓴다
# - mimeapps.list: forky에서 경로가 겹치는 꾸러미가 하나 있다(sxmo-utils)
# - foot: Ctrl+C·Ctrl+V 바인딩(clipboard-copy-or-cancel)을 더해 빌드한 판이다(image/foot). 설정 /etc/xdg/foot/foot.ini는
#   설정 파일이라 dpkg가 우리 것을 남긴다(70-buntos-guard의 --force-confold)
GUARD_DIVERT=(/usr/lib/os-release /usr/share/applications/mimeapps.list /usr/bin/foot)

# 이 라이브러리는 이 자리에서 읽혀야 한다. 라이브러리=경로 앞부분. 공통으로는 없다. 라이브러리를 따로 빌드해 넣는 보드가 더한다
GUARD_LIBS=()

# 켜짐 상태를 비교할 서비스
GUARD_UNITS=('buntos-*' greetd.service NetworkManager.service)

# 남길 스냅숏 수와, 스냅숏을 만들 때 있어야 할 루트 여유. 루트가 btrfs 서브볼륨일 때만 쓴다
GUARD_KEEP=3
GUARD_MIN_FREE_GB=3
