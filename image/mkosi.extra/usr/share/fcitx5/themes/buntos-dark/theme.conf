# fcitx5 후보 창 테마. macOS 26의 한자 후보 창처럼 둥근 패널에 고른 후보는 강조색(시스템 파랑)과
# 흰 글씨다. 색은 theme/tokens.css와 맞춘다. 이미지는 9분할로 늘린다 (Margin 바깥 부분이 모서리)

[Metadata]
Name=buntOS Dark
Version=1
Author=buntOS contributors
Description=buntOS (어둡게)
ScaleWithDPI=True

[InputPanel]
NormalColor=#e6e6e8
HighlightCandidateColor=#ffffff
HighlightColor=#ffffff
HighlightBackgroundColor=#0091ff
CandidateLabelColor=#98989d
HighlightCandidateLabelColor=#ffffff
PageButtonAlignment=Last Candidate
FullWidthHighlight=True
EnableBlur=False

[InputPanel/ShadowMargin]
Left=10
Right=10
Top=10
Bottom=10

[InputPanel/ContentMargin]
Left=15
Right=15
Top=15
Bottom=15

[InputPanel/TextMargin]
Left=8
Right=8
Top=5
Bottom=5

[InputPanel/Background]
Image=panel.png

[InputPanel/Background/Margin]
Left=24
Right=24
Top=24
Bottom=24

[InputPanel/Highlight]
Image=highlight.png

[InputPanel/Highlight/Margin]
Left=10
Right=10
Top=10
Bottom=10

[InputPanel/PrevPage]
Image=prev.png

[InputPanel/PrevPage/ClickMargin]
Left=4
Right=4
Top=4
Bottom=4

[InputPanel/NextPage]
Image=next.png

[InputPanel/NextPage/ClickMargin]
Left=4
Right=4
Top=4
Bottom=4

[Menu]
NormalColor=#e6e6e8
HighlightCandidateColor=#ffffff

[Menu/Background]
Image=panel.png

[Menu/Background/Margin]
Left=24
Right=24
Top=24
Bottom=24

[Menu/ContentMargin]
Left=15
Right=15
Top=15
Bottom=15

[Menu/Highlight]
Image=highlight.png

[Menu/Highlight/Margin]
Left=10
Right=10
Top=10
Bottom=10

[Menu/Separator]
Color=#48484a

[Menu/TextMargin]
Left=8
Right=8
Top=5
Bottom=5
