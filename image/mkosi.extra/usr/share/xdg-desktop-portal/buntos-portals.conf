# buntOS 세션(XDG_CURRENT_DESKTOP=buntOS)이 쓰는 포털 구현.
# 설정, 파일 선택 등은 GTK 구현(xdg-desktop-portal-gtk)이 맡는다.
# 샌드박스 앱(Flatpak)의 비밀은 gnome-keyring이 login 키링에 저장한다 (mkosi.conf.d/20-desktop.conf)
[preferred]
default=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
