# 부팅 때 루트 파티션을 디스크 끝까지 늘린다. systemd-repart.service가 이 정의를 읽는다
# (mkosi.conf.d/10-disk.conf). 이미지는 빌드 때 루트를 내용에 맞춰 작게 만들므로
# (image/mkosi.repart/10-root.conf의 Minimize=guess) 늘리지 않으면 여유가 거의 없다.
# 파일 시스템(btrfs)은 systemd-growfs-root.service가 따라 늘린다: 빌드 때 루트 파티션에 GPT 속성 59
# (growfs)를 붙이므로 systemd-gpt-auto-generator가 그 서비스를 건다.
# 디스크가 더 커지면 다음 부팅 때 다시 늘린다. 정의가 없는 파티션(ESP)은 건드리지 않고 새 파티션도
# 만들지 않는다

[Partition]
Type=root
