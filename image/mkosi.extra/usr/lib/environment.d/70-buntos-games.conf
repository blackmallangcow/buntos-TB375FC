# systemd 사용자 서비스(D-Bus로 뜨는 앱: 파일 앱, 앱 스토어)의 PATH에 Debian이 게임을 두는 곳을 더한다. GIO는 Exec의
# 프로그램이 PATH에 없는 .desktop을 없는 앱으로 친다. 그래서 /usr/games에 설치된 게임을 파일 앱에서 연 패키지 매니저가
# 찾지 못했다. 셸은 로그인 때 /etc/profile의 PATH를 받아 이미 이 경로가 있다
PATH=${PATH}:/usr/local/games:/usr/games
