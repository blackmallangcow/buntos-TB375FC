#
# buntOS의 foot 설정. 이미지가 /etc/xdg/foot/foot.ini로 넣는다(tools/image/build.sh). 사용자의 ~/.config/foot/foot.ini가
# 있으면 foot은 이 파일을 읽지 않는다. 옵션과 기본값은 foot.ini(5)에 있다.

[key-bindings]
# 다른 앱처럼 Ctrl+C로 복사하고 Ctrl+V로 붙인다(Windows 터미널과 같다, DESIGN-SPEC 11장).
# - Ctrl+C: 고른 글이 있으면 복사하고 고른 표시를 지운다. 고른 글이 없으면 그대로 인터럽트(^C)다. 복사한 뒤 누르고
#   있어도 인터럽트하지 않는다. clipboard-copy-or-cancel은 buntOS가 고친 foot에만 있다(image/foot)
# - Ctrl+V: 붙여넣기. 그래서 터미널 안의 프로그램은 Ctrl+V를 받지 못한다(vim의 블록 선택은 Ctrl+Q로 한다)
# ⌘C와 ⌘V는 컴포지터가 foot의 기본 키 Ctrl+Shift+C와 Ctrl+Shift+V로 바꿔 보낸다
clipboard-copy-or-cancel=Control+c
clipboard-paste=Control+v Control+Shift+v XF86Paste
