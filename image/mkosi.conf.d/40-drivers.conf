# 필수 드라이버와 하드웨어 서비스. 드라이버 대부분은 커널(linux-image-*)에 모듈로 들어 있고,
# 여기서는 장치가 동작하는 데 필요한 펌웨어와 사용자 공간 서비스를 넣는다.
# 아키텍처에 따라 다른 것(CPU 마이크로코드 등)은 bsp/<보드>/mkosi.conf에 둔다.
# - 펌웨어: Debian non-free-firmware 구성 요소. 배포 조건은 패키지마다 다르다
#   (debian/copyright). NVIDIA(nouveau GSP)와 Qualcomm SoC 펌웨어는 크기가 커서 해당 기기
#   BSP를 만들 때 넣는다
# - Wi-Fi: NetworkManager가 쓰는 wpasupplicant와 규제 도메인(wireless-regdb). Intel, Realtek,
#   MediaTek, Qualcomm Atheros, Broadcom, Marvell, TI 칩 펌웨어 (같은 회사 Bluetooth 펌웨어 포함)
# - Bluetooth: bluez(bluetoothd)와 Broadcom Bluetooth 펌웨어
# - 소리: PipeWire(PulseAudio·ALSA 호환과 Bluetooth 오디오), 노트북 오디오 DSP(SOF, Cirrus 앰프)
#   펌웨어와 UCM 설정. 음량은 WirePlumber(wpctl)로 바꾼다
# - 그래픽: AMD, Intel GPU 펌웨어. Mesa 드라이버는 20-desktop.conf
# - 전원과 센서: UPower(배터리), power-profiles-daemon(저전력 모드), iio-sensor-proxy(태블릿의
#   회전·조도 센서)
# - 장치 확인 도구: lspci, lsusb, iw, rfkill

[Distribution]
Repositories=non-free-firmware

[Content]
Packages=
        firmware-linux-free
        firmware-misc-nonfree
        firmware-iwlwifi
        firmware-realtek
        firmware-mediatek
        firmware-atheros
        firmware-brcm80211
        firmware-libertas
        firmware-ti-connectivity
        firmware-amd-graphics
        firmware-intel-graphics
        firmware-intel-misc
        firmware-intel-sound
        firmware-sof-signed
        firmware-cirrus
        bluez-firmware
        wireless-regdb
        wpasupplicant
        iw
        rfkill
        bluez
        pipewire
        pipewire-pulse
        pipewire-alsa
        wireplumber
        libspa-0.2-bluetooth
        alsa-ucm-conf
        alsa-utils
        upower
        power-profiles-daemon
        iio-sensor-proxy
        pciutils
        usbutils
