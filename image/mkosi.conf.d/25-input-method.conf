#
# 한글 입력기. fcitx5가 Wayland 입력기 프로토콜(input-method-v2)로 앱(text-input-v3)에 한글을
# 넣는다. bunt-comp가 세션과 함께 띄우고(comp.toml의 input-method), 기본 설정은
# /etc/xdg/fcitx5/에 있다. GTK4와 foot은 text-input-v3를 쓰므로 GTK·Qt용 입력 모듈은 넣지 않는다

[Content]
Packages=
        fcitx5
        fcitx5-hangul
