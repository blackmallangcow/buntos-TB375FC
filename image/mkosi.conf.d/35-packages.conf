#
# 앱 설치: 패키지 매니저(bunt-packages)와 앱 스토어 (ADR-014, ARCHITECTURE 5.5절).
# - packagekit: .deb의 설치와 제거. polkit으로 관리자 인증을 받고 apt로 의존성을 푼다. 패키지 매니저와 앱
#   스토어가 같은 서비스를 쓰므로 apt 잠금을 두고 다투지 않는다
# - flatpak: 샌드박스 앱. .flatpak, .flatpakref, .flatpakrepo를 열고 Flathub에서 앱을 받는다.
#   Flathub 저장소는 mkosi.postinst.chroot가 넣는다(인터넷 없이 된다, 지우면 다시 생기지 않는다)
#   desktop-file-utils, p11-kit: flatpak의 Recommends. mkosi는 Recommends를 넣지 않으므로 직접 적는다.
#   앱 목록을 갱신하고 샌드박스 앱이 시스템 인증서를 쓰게 한다
# - squashfs-tools: AppImage를 풀 때 쓴다. 받은 프로그램을 실행하지 않고 안의 .desktop과 아이콘을 읽고 푼다
# - gnome-software와 플러그인 둘: 앱 스토어. Debian 패키지(plugin-deb, DEP-11 목록)와 Flathub(plugin-flatpak)를 한
#   곳에서 찾아 설치하고 업데이트한다. GNOME 전용 자동 시작은 이 세션에서 돌지 않으므로 앱을 연 동안만 메모리를 쓴다.
#   fwupd 플러그인(Recommends)은 넣지 않는다

[Content]
Packages=
        packagekit
        flatpak
        desktop-file-utils
        p11-kit
        squashfs-tools
        gnome-software
        gnome-software-plugin-deb
        gnome-software-plugin-flatpak
