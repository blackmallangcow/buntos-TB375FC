# 기본 앱. 리눅스 데스크톱에서 널리 쓰는 GNOME 앱(GTK4, libadwaita)과 터미널용 편집기·도구.
# 앱을 바꾸면 Dock 목록(shell/data/shell.toml)도 함께 고친다.
# 웹 브라우저는 Firefox ESR(Debian이 보안 업데이트를 내는 판)과 한국어 언어 팩이다.
# 시스템 모니터는 GNOME의 Resources(resources 51)다. GNOME 시스템 모니터와 달리 CPU, 메모리, 디스크,
# 네트워크에 GPU도 보인다. GPU 사용량은 드라이버가 알리는 것만 읽고(amdgpu, i915, xe, v3d, NVIDIA), 3D가
# 없는 VM의 virtio-gpu는 0%다. Debian의 51.0에는 한국어 번역이 없어 영어로 보인다
# 동영상은 GNOME의 Showtime이다. macOS가 화면 기록을 QuickTime Player로 열듯 ⇧⌘5로 기록한 WebM을 연다.
# macOS의 Dock처럼 Dock에는 두지 않는다
# wl-clipboard: 터미널의 클립보드(wl-copy, wl-paste). macOS의 pbcopy, pbpaste에 해당한다. 포커스 없이 도는 길은
# 컴포지터가 연다(comp/src/clipboard.rs)

[Content]
Packages=
        nautilus
        firefox-esr
        firefox-esr-l10n-ko
        gnome-text-editor
        gnome-calculator
        loupe
        papers
        resources
        showtime
        nano
        vim
        htop
        wl-clipboard
