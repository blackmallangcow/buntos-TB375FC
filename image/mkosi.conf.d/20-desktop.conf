#
# 그래픽 세션(bunt-comp, bunt-shell, bunt-settings)이 쓰는 라이브러리와 서비스.
# - Mesa: GPU가 없으면 소프트웨어 렌더러(llvmpipe)로 그린다
# - 글꼴은 ADR-005 잠정안: UI는 Pretendard, 한중일 폴백과 고정폭은 Noto CJK
# - 공용 데스크톱 설정(GSettings)은 dconf에 저장한다. 시스템 설정과 GNOME 앱이 같은 값을 읽는다
# - polkitd: 시스템 설정과 전원 메뉴가 요청하는 관리 작업의 허용 여부를 정한다
# - xdg-desktop-portal: GTK는 글꼴, 밝게·어둡게, 창 버튼 같은 설정을 포털로 읽는다.
#   구현은 GTK 포털이 맡는다 (/usr/share/xdg-desktop-portal/buntos-portals.conf)
# - at-spi2-core: 접근성 버스. GTK 앱이 접근성 트리를 내놓고, 에이전트 데몬(buntd-agent)과 화면
#   읽기 프로그램이 그 트리를 읽는다
# - accountsservice: 계정의 이름·사진을 시스템 설정과 로그인 화면이 함께 읽고 바꾼다
# - greetd: 로그인 관리자. VT1에 로그인 화면(bunt-greeter)을 띄우고, 로그인하면 같은 VT에서
#   사용자 세션을 연다 (greeter/data/root/etc/greetd/config.toml)
# - libgtk4-layer-shell0: 셸의 레이어 창과 잠금 화면(bunt-lock)의 잠금 표면. 잠금 화면은 1.2 이상의 세션 잠금
#   API(ext-session-lock-v1)를 실행할 때 찾는다(greeter/src/lock/session_lock.rs). forky는 1.3이다
# - pkexec: 시스템 설정이 관리자 인증(계정 암호)을 받고 특권 도우미를 실행한다
# - bsdutils: 시스템 설정이 암호를 바꿀 때 passwd를 가상 터미널(script)에서 돌린다. Debian forky에서는
#   필수 패키지가 아니어서 mkosi가 넣지 않는다
# - gnome-keyring: 비밀 서비스(org.freedesktop.secrets). 앱이 암호와 토큰을 libsecret으로 저장한다.
#   libpam-gnome-keyring은 macOS의 로그인 키체인처럼 로그인 암호로 login 키링을 연다(처음 로그인하면
#   만든다). 그래서 앱이 비밀을 저장하거나 읽을 때 잠금 해제 창이 뜨지 않는다. 꾸러미의 pam-auth-update
#   설정이 common-auth·common-session·common-password에 들어가고, greetd는 그 파일들을 쓴다. 암호를
#   바꾸면(passwd) 키링 암호도 따라 바뀐다. 이 꾸러미가 없으면 앱이 처음 비밀을 저장할 때 새 키링의
#   암호를 따로 묻고, 그 뒤로 앱을 켤 때마다 잠금 해제 창이 뜬다
# - sound-theme-freedesktop: XDG 사운드 테마 freedesktop. 경고음과 시동음은 buntOS 사운드 테마(buntos,
#   tools/sounds/generate.py로 만들어 tools/image/build.sh가 넣는다)이고, 그 테마에 없는 이름(앱이 알림에 정한
#   소리 등)은 이 테마에서 찾는다. 셸과 로그인 화면이 pw-play(pipewire-bin)로 낸다
# - gstreamer1.0-tools·plugins-base·plugins-good: ⇧⌘5의 화면 기록. 컴포지터가 읽은 프레임을 따로 띄운
#   gst-launch-1.0(rawvideoparse, videoconvert, vp8enc, webmmux)이 VP8/WebM 파일로 쓴다(comp/src/recording.rs).
#   VP8/WebM은 사용료가 없고 Firefox가 재생한다. H.264는 특허 풀 라이선스가 걸리고, AV1은 CPU로 실시간
#   부호화하기에 무겁다. GNOME 셸도 H.264 부호기가 없으면 같은 VP8/WebM으로 기록한다

[Content]
Packages=
        libgl1-mesa-dri
        libegl1
        libegl-mesa0
        libgles2
        libgbm1
        libinput10
        libseat1
        libxkbcommon0
        xkb-data
        libgtk-4-1
        libgtk4-layer-shell0
        gtk-update-icon-cache
        gsettings-desktop-schemas
        dconf-gsettings-backend
        libglib2.0-bin
        polkitd
        xdg-desktop-portal
        xdg-desktop-portal-gtk
        at-spi2-core
        accountsservice
        pkexec
        greetd
        bsdutils
        gnome-keyring
        libpam-gnome-keyring
        foot
        fonts-pretendard
        fonts-noto-cjk
        adwaita-icon-theme
        dbus-user-session
        locales
        sound-theme-freedesktop
        gstreamer1.0-tools
        gstreamer1.0-plugins-base
        gstreamer1.0-plugins-good
