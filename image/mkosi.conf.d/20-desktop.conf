#
# 그래픽 세션(bunt-comp, bunt-shell)이 쓰는 라이브러리와 기본 앱.
# - Mesa: GPU가 없으면 소프트웨어 렌더러(llvmpipe)로 그린다
# - 글꼴은 ADR-005 잠정안: UI는 Pretendard, 한중일 폴백과 고정폭은 Noto CJK

[Content]
Packages=
        libgl1-mesa-dri
        libegl1
        libegl-mesa0
        libgles2
        libgbm1
        libinput10
        libseat1
        libxkbcommon0
        xkb-data
        libgtk-4-1
        libgtk4-layer-shell0
        foot
        fonts-pretendard
        fonts-noto-cjk
        adwaita-icon-theme
        dbus-user-session
        locales
