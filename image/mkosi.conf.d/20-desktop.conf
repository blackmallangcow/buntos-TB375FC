#
# 그래픽 세션(bunt-comp, bunt-shell, bunt-settings)이 쓰는 라이브러리와 서비스.
# - Mesa: GPU가 없으면 소프트웨어 렌더러(llvmpipe)로 그린다
# - 글꼴은 ADR-005 잠정안: UI는 Pretendard, 한중일 폴백과 고정폭은 Noto CJK
# - 공용 데스크톱 설정(GSettings)은 dconf에 저장한다. 시스템 설정과 GNOME 앱이 같은 값을 읽는다
# - polkitd: 시스템 설정과 전원 메뉴가 요청하는 관리 작업의 허용 여부를 정한다
# - xdg-desktop-portal: GTK는 글꼴, 밝게·어둡게, 창 버튼 같은 설정을 포털로 읽는다.
#   구현은 GTK 포털이 맡는다 (/usr/share/xdg-desktop-portal/buntos-portals.conf)

[Content]
Packages=
        libgl1-mesa-dri
        libegl1
        libegl-mesa0
        libgles2
        libgbm1
        libinput10
        libseat1
        libxkbcommon0
        xkb-data
        libgtk-4-1
        libgtk4-layer-shell0
        gtk-update-icon-cache
        gsettings-desktop-schemas
        dconf-gsettings-backend
        libglib2.0-bin
        polkitd
        xdg-desktop-portal
        xdg-desktop-portal-gtk
        foot
        fonts-pretendard
        fonts-noto-cjk
        adwaita-icon-theme
        dbus-user-session
        locales
