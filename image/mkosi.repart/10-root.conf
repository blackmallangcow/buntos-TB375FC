# 루트 파일 시스템은 btrfs다 (D6: 스냅샷 기반 롤백)
# 이미지는 내용에 맞춰 작게 만들고(Minimize=guess) 부팅 때 디스크 끝까지 늘린다
# (mkosi.extra/usr/lib/repart.d/10-root.conf, GPT 속성 59)

[Partition]
Type=root
Format=btrfs
CopyFiles=/
Minimize=guess
