# buntOS 공통 이미지 레시피. 아키텍처별 차이는 bsp/<보드>/mkosi.conf에만 둔다(D3).
# 빌드는 tools/image/build.sh <보드>로 한다 (docs/dev/environment.md).

[Distribution]
Distribution=debian
Release=forky
# ADR-004: snapshot.debian.org의 특정 시점으로 고정한다. 갱신은 별도 PR로 올린다
Snapshot=20261027T083111Z

[Output]
Format=disk
ImageId=buntos

[Content]
Bootable=yes
Bootloader=systemd-boot
# mkosi는 Essential 패키지와 여기 적은 것만 설치한다. Debian에서 Priority: required이지만
# Essential이 아닌 login, passwd, apt, tzdata는 직접 적어야 한다
# (없으면 콘솔 로그인, 패키지 설치, 시간대 설정이 안 된다)
Packages=
        login
        passwd
        apt
        tzdata
        debian-archive-keyring
        ca-certificates
        systemd
        systemd-sysv
        systemd-boot
        systemd-boot-efi
        udev
        dbus
        btrfs-progs
        sudo
Locale=C.UTF-8
# 한국어 우선 이미지의 기본 시간대. 최초 설정을 설계하면 거기서 고른다
Timezone=Asia/Seoul
Keymap=us
Hostname=buntos
# 사용자 계정과 최초 설정을 설계하기 전까지 최초 설정 화면을 끈다
KernelCommandLine=systemd.firstboot=no
# Phase 0 개발용: 사용자 계정을 설계하기 전까지 콘솔에서 root로 자동 로그인한다
Autologin=yes

[Runtime]
# 게스트가 에뮬레이션 TPM을 잡지 못하는 문제가 풀릴 때까지 끈다 (docs/dev/environment.md의 알려진 문제)
TPM=no
