[package]
name = "bunt-shell"
description = "buntOS shell: menu bar and dock"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# AI 접근 요청 창: 에이전트 데몬의 요청 기록과 접근 정책을 읽는다
bunt-access = { path = "../access" }
bunt-i18n = { path = "../i18n" }
# 사운드 메뉴와 알림 소리: wpctl·pw-dump·pw-cli 출력 읽기, 채널 음량(균형), 사운드 테마 (시스템 설정과 같이 쓴다)
bunt-sound = { path = "../sound" }
gdk4-wayland = { version = "0.11", features = ["wayland_crate"] }
gio-unix = "0.22"
gtk4 = { version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "1"
# gtk4-layer-shell은 libwayland-client보다 먼저 링크돼야 동작한다. libwayland-client를 직접 링크하지
# 않고 실행 중에 연다(dlopen). GTK가 이미 연 라이브러리를 같이 쓴다
wayland-client = { version = "0.31", features = ["dlopen"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
