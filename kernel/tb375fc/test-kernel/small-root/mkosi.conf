# 2b 확인용 작은 Debian 루트. 전체 이미지(맥 여유 30GB)를 만들기 전에 UFS 루트 전환과 SSH를 본다.
# 빌드는 build.sh가 한다. 커널 모듈과 공개 키는 그쪽에서 넣는다.
[Distribution]
Distribution=debian
Release=forky
Snapshot=20261027T083111Z
Architecture=arm64

[Output]
Format=disk
ImageId=buntos-small
SplitArtifacts=partitions

[Content]
Bootable=no
WithDocs=no
Packages=
        login
        mount
        passwd
        apt
        tzdata
        debian-archive-keyring
        ca-certificates
        systemd
        systemd-sysv
        udev
        dbus
        btrfs-progs
        sudo
        libnss-myhostname
        curl
        openssh-server
        busybox-static
        evtest
        i2c-tools
        gpiod
        iproute2
        kmod
        less
        procps
        gdisk
Locale=C.UTF-8
Timezone=Asia/Seoul
Keymap=us
Hostname=buntos
ExtraTrees=../../../../bsp/lenovo-tb375fc/mkosi.extra
PostInstallationScripts=../../../../bsp/lenovo-tb375fc/mkosi.postinst.chroot
