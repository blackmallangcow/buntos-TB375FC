[package]
name = "bunt-packages"
description = "buntOS package manager"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# 패키지 관리 서비스의 신호와 진행 상황을 주 스레드의 비동기 코드로 넘긴다 (GTK가 이미 쓴다)
async-channel = "2"
bunt-i18n = { path = "../i18n" }
# 설치한 앱의 .desktop 파일을 읽어 이름과 아이콘을 얻고 실행한다
gio-unix = "0.22"
gtk4 = { version = "0.11", features = ["v4_12"] }
