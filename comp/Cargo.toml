[package]
name = "bunt-comp"
description = "buntOS Wayland compositor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xcursor = "0.3"
# 시스템 설정이 화면과 키 반복을 바꾸는 D-Bus 서비스, 입력 소스 전환(fcitx5 호출)
zbus = "5"

[dependencies.smithay]
version = "0.7.0"
default-features = false
features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "desktop",
    "renderer_gl",
    "wayland_frontend",
]
