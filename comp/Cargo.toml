[package]
name = "bunt-comp"
description = "buntOS Wayland compositor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# 사용자에게 보이는 문구(스크린샷 알림, 파일 이름)
bunt-i18n = { path = "../i18n" }
# 스크린샷 파일 이름의 지역 시각 (localtime_r)
libc = "0.2"
# 스크린샷을 PNG로
png = "0.18"
serde = { version = "1", features = ["derive"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xcursor = "0.3"
# 시스템 설정이 화면과 키 반복을 바꾸는 D-Bus 서비스, 입력 소스 전환(fcitx5 호출)
zbus = "5"

[dev-dependencies]
# 시험(src/testing.rs)과 예제(examples/)의 Wayland 클라이언트
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
# 예제가 dmabuf를 만든다 (examples/glass-window.rs). smithay와 같은 기능만 켠다
gbm = { version = "0.18", default-features = false, features = ["drm-support"] }

[dependencies.smithay]
version = "0.7.0"
default-features = false
features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "desktop",
    "renderer_gl",
    "wayland_frontend",
]
