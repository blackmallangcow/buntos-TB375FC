# bunt-comp 기본 설정. /etc/buntos/comp.toml이 있으면 그 파일을 쓴다.

[wallpaper]
# 위에서 아래로 이어지는 그라데이션
top = "#5b7cfa"
bottom = "#f2a7c3"

[keyboard]
layout = "us"
repeat-delay = 200
repeat-rate = 25

[effects]
# 셸 유리(메뉴, 제어 센터, Dock, 모든 앱 패널) 뒤를 흐리게 그린다. 셸 표면의 알파가 0.5 이상인 곳만
blur = true

[cursor]
theme = "Adwaita"
size = 24

[session]
# 컴포지터가 뜬 뒤 차례로 실행하며 하나씩 끝날 때까지 기다리는 명령. 금방 끝나는 것만 둔다.
# 세션 환경을 D-Bus와 systemd 사용자 서비스에 알려, D-Bus로 활성화하는 앱과 포털이
# 이 화면에 뜨고 같은 언어와 렌더러를 쓰게 한다. bunt-shell보다 먼저 끝나야 한다.
# GSK_RENDERER는 컴포지터가 CPU로 그릴 때만 cairo로 준다(gpu.rs). 주지 않은 변수는 건너뛴다
prepare = [
    [
        "dbus-update-activation-environment", "--systemd",
        "WAYLAND_DISPLAY", "XDG_CURRENT_DESKTOP", "XDG_SESSION_TYPE", "LANG",
        "GSK_RENDERER", "XCURSOR_THEME", "XCURSOR_SIZE",
    ],
]
# 셸(메뉴바, Dock). 창 목록·창 조작 프로토콜(wlr-foreign-toplevel)을 쓸 수 있는
# 특권 클라이언트로 띄운다. 다른 앱에는 이 프로토콜이 보이지 않는다
shell = ["bunt-shell"]
# 입력기(한글 입력). 키보드를 잡고 조합한 글자를 보내는 프로토콜을 이 연결에만 연다.
# 꺼지면 다시 띄운다. 입력 소스 전환(Ctrl+Space, 한/영 키)은 컴포지터가 받아 D-Bus로 알린다.
# 세션의 XDG_CURRENT_DESKTOP(buntOS:GNOME)에 GNOME이 있으면 fcitx5는 GNOME 셸로 알고, 입력기 팝업을
# 보이려면 셸 확장(kimpanel)을 깔라고 알린다. 팝업은 컴포지터가 input-method-v2로 띄우므로 입력기에는
# buntOS만 준다
input-method = ["env", "XDG_CURRENT_DESKTOP=buntOS", "fcitx5"]
# 그 밖에 셸 다음에 실행할 프로그램. 에이전트 데몬은 사용자가 허용한 AI가 있으면 접근성을 켜고
# 끝난다. Chromium·Electron 앱은 뜰 때만 접근성이 켜졌는지 보므로 앱이 뜨기 전에 켠다
startup = [["buntd-agent", "--prepare-session"]]
# Alt+Enter로 여는 터미널
terminal = ["foot"]
