[package]
name = "bunt-greeter"
description = "buntOS login window and first-boot setup"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "bunt-greeter"
path = "src/main.rs"

[[bin]]
name = "buntd-setup"
path = "src/bin/buntd-setup.rs"

[dependencies]
bunt-i18n = { path = "../i18n" }
gtk4 = { version = "0.11", features = ["v4_12"] }
# greetd IPC (JSON)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# buntd-setup: 시스템 버스의 계정 만들기 서비스. GTK는 쓰지 않는다
zbus = "5"
