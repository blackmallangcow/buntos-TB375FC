[package]
name = "bunt-greeter"
description = "buntOS login window, lock screen and first-boot setup"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "bunt-greeter"
path = "src/main.rs"

[[bin]]
name = "buntd-setup"
path = "src/bin/buntd-setup.rs"

# 잠금 화면. 로그인 화면과 모양(사진, 흐린 배경화면, 시각)을 함께 쓴다
[[bin]]
name = "bunt-lock"
path = "src/lock/main.rs"

[dependencies]
bunt-i18n = { path = "../i18n" }
gtk4 = { version = "0.11", features = ["v4_12"] }
# 잠금 화면의 잠금 표면(ext-session-lock-v1)은 libgtk4-layer-shell이 만든다(src/lock/session_lock.rs). 1.0을 요구하므로
# 빌드 VM(Debian 13, 1.0.4)에서도 빌드되고, 세션 잠금 함수(1.1+)는 실행할 때 이미지(forky, 1.3)의 라이브러리에서 찾는다
gtk4-layer-shell = "0.8"
# 잠금 화면의 암호 확인(PAM)과 세션 잠금 함수 찾기(dlsym)
libc = "0.2"
# greetd IPC (JSON)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# buntd-setup: 시스템 버스의 계정 만들기 서비스. GTK는 쓰지 않는다
zbus = "5"
