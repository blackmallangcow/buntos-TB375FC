처음 켤 때 계정을 만드는 buntd-setup (org.buntos.Setup1). root만 이름을 가지고, root와 로그인
화면 사용자(_greetd)만 부른다. 서비스도 부른 쪽의 uid를 한 번 더 보고, 정규 계정이 없을 때만
계정을 만든다
-->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.buntos.Setup1"/>
    <allow send_destination="org.buntos.Setup1"/>
  </policy>
  <policy user="_greetd">
    <allow send_destination="org.buntos.Setup1"/>
  </policy>
  <policy context="default">
    <deny send_destination="org.buntos.Setup1"/>
  </policy>
</busconfig>
