# 로그인 화면은 VT1에 뜬다 (/etc/greetd/config.toml). 그 자리의 텍스트 로그인(getty@tty1)과 겹치지
# 않게 한다. 이미지는 getty@tty1을 아예 막는다 (image/mkosi.postinst.chroot)

[Unit]
Conflicts=getty@tty1.service
After=getty@tty1.service
# 시험·개발용 계정(자격 증명 buntos.account)을 먼저 만든다
After=buntos-account.service
