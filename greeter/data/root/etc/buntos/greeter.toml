# 로그인 화면의 컴포지터 설정. 로그인 화면 세션(/usr/libexec/buntos/greeter-session)이
# BUNT_COMP_CONFIG로 이 파일을 준다. 사용자 세션의 기본값은 comp/data/comp.toml이다

[wallpaper]
# 로그인 화면이 흐린 배경화면을 그리기 전에 잠깐 보인다
top = "#1d2433"
bottom = "#3b3550"

[keyboard]
layout = "us"
repeat-delay = 200
repeat-rate = 25

[effects]
# 로그인 화면에는 셸 유리가 없다
blur = false

[cursor]
theme = "Adwaita"
size = 24

[session]
# 로그인 화면. bunt-greeter가 끝나면(로그인했거나 죽었으면) 이 컴포지터도 끝난다(exit-with-shell). 그래야
# greetd가 예약한 사용자 세션을 바로 열거나 로그인 화면을 다시 띄운다(기다리게 두면 greetd가 5초 뒤에 끝낸다).
# 전에는 셸 스크립트(greeter-shell)가 부모인 컴포지터에 SIGTERM을 보냈다
shell = ["bunt-greeter"]
exit-with-shell = true
# 계정을 만들 때 별칭을 한글로 쓸 수 있게 입력기를 띄운다 (Ctrl+Space, 한/영)
input-method = ["fcitx5"]
startup = []
# 로그인 화면에서는 터미널(Alt+Enter)을 열지 않는다
terminal = []
