version = 1

[[annotations]]
path = ["docs/**", "README.md", "CONTRIBUTING.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 buntOS contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = [".gitignore", ".github/**", "Cargo.lock"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 buntOS contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# 코드 파일은 각자 SPDX 헤더를 단다. 이 항목은 헤더를 읽지 못할 때만 쓰인다.
# reuse는 앞 2KiB로 인코딩을 추정하는데, 그 경계에서 한글 글자가 잘리면 파일을 읽지 못한다.
[[annotations]]
path = ["access/**", "agent/**", "bsp/**", "comp/**", "greeter/**", "i18n/**", "image/**", "keyboard/**", "packages/**", "settings/**", "shell/**", "sound/**", "tests/**", "theme/**", "tools/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 buntOS contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"
