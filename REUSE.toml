version = 1

[[annotations]]
path = ["docs/**", "README.md", "README.ko.md", "CONTRIBUTING.md", "kernel/**/README.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 buntOS contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = [".gitignore", ".github/**", "Cargo.lock"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 buntOS contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# 코드 파일은 각자 SPDX 헤더를 단다. 이 항목은 헤더를 읽지 못할 때만 쓰인다.
# reuse는 앞 2KiB로 인코딩을 추정하는데, 그 경계에서 한글 글자가 잘리면 파일을 읽지 못한다.
[[annotations]]
path = ["access/**", "agent/**", "bsp/**", "comp/**", "greeter/**", "i18n/**", "image/**", "keyboard/**", "packages/**", "settings/**", "shell/**", "sound/**", "tests/**", "theme/**", "tools/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 buntOS contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# TB375FC 커널 패치는 Linux에 얹으므로 리눅스와 같은 GPL-2.0-only다. 패치 파일 안에는 머리를 달 수 없다.
# 패치 본문의 SPDX·저작권 줄은 패치가 더하는 리눅스 파일의 머리라서 패치 파일의 것으로 읽지 않는다(override).
# 패치마다 지은이는 From:에, 코드의 저작권은 그 파일 머리에 있다
[[annotations]]
path = ["kernel/tb375fc/patches/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 buntOS contributors"
SPDX-License-Identifier = "GPL-2.0-only"

# 위 항목의 예외. 패치가 고치는 파일의 라이선스가 GPL-2.0-only가 아니거나(dt-bindings의 이중 라이선스, mt76의
# BSD-3-Clause-Clear, panthor의 GPL-2.0 OR MIT 등) 지은이가 다른 사람인(업스트림에서 가져온) 패치다.
# 라이선스는 리눅스 7.2.12 원본에서 그 파일들의 SPDX 머리를 읽어 정했다. 여러 항목이 맞으면 뒤의 것이 쓰인다
[[annotations]]
path = ["kernel/tb375fc/patches/0002-spmi-mtk-pmif-Add-workaround-for-FSM-lockup-error-in-read-operation.patch", "kernel/tb375fc/patches/0016-mfd-Add-support-for-MediaTek-SPMI-PMICs-and-MT6363-73.patch"]
precedence = "override"
SPDX-FileCopyrightText = "2026 AngeloGioacchino Del Regno"
SPDX-License-Identifier = "GPL-2.0-only"

